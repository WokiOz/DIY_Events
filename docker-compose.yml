services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evenements}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evenements}
      POSTGRES_DB: ${POSTGRES_DB:-evenements}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evenements} -d ${POSTGRES_DB:-evenements}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ghcr.io/wokioz/diy_events-app:7b402f4410810bdd40b2de2ee8ffccd0d9188f0a
    restart: unless-stopped
    environment:
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-changez-cette-cle-en-production}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-evenements}
      PGPASSWORD: ${POSTGRES_PASSWORD:-evenements}
      PGDATABASE: ${POSTGRES_DB:-evenements}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
