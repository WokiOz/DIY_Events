# Chargé automatiquement par docker compose.
# Monte le code dans le conteneur : plus besoin de reconstruire à chaque modification.
# Supprimez ce fichier pour revenir à l'image figée.
services:
  app:
    command: ["node", "--watch", "src/index.js"]
    volumes:
      - ./server/src:/app/src
      - ./server/public:/app/public
      - uploads:/app/uploads
