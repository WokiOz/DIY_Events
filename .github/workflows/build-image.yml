name: Construire et publier l'image de production

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ghcr.io/wokioz/diy_events-app:${{ github.sha }}

      - name: Pointer docker-compose.yml sur la nouvelle image
        run: |
          sed -i "s#image: ghcr.io/wokioz/diy_events-app:.*#image: ghcr.io/wokioz/diy_events-app:${{ github.sha }}#" docker-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Image ${{ github.sha }}"
          git push
